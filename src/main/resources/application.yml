server:
  port: 8082

spring:
  application:
    name: ocpp-service
  mvc:
    async:
      # Remote OCPP commands time out at 30s; keep the servlet async timeout above it.
      request-timeout: ${SERVER_MVC_ASYNC_REQUEST_TIMEOUT:35s}
  datasource:
    url: jdbc:postgresql://localhost:5432/ocpp_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      compression-type: lz4
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

ocpp:
  heartbeat:
    interval-seconds: ${OCPP_HEARTBEAT_INTERVAL_SECONDS:60}
    timeout-seconds: ${OCPP_HEARTBEAT_TIMEOUT_SECONDS:180}
    check-interval-seconds: ${OCPP_HEARTBEAT_CHECK_INTERVAL_SECONDS:30}
  message:
    response-timeout-seconds: 30
  websocket:
    max-text-message-size: 65536
    max-binary-message-size: 65536
  inbound:
    call-executor:
      core-pool-size: ${OCPP_INBOUND_CALL_EXECUTOR_CORE_POOL_SIZE:64}
      max-pool-size: ${OCPP_INBOUND_CALL_EXECUTOR_MAX_POOL_SIZE:64}
      queue-capacity: ${OCPP_INBOUND_CALL_EXECUTOR_QUEUE_CAPACITY:2000}
  telemetry:
    executor:
      core-pool-size: ${OCPP_TELEMETRY_EXECUTOR_CORE_POOL_SIZE:32}
      max-pool-size: ${OCPP_TELEMETRY_EXECUTOR_MAX_POOL_SIZE:32}
      queue-capacity: ${OCPP_TELEMETRY_EXECUTOR_QUEUE_CAPACITY:1000}
  authorization-grant:
    ttl-seconds: ${OCPP_AUTHORIZATION_GRANT_TTL_SECONDS:300}
  iso15118:
    certificate-installation-enabled: ${OCPP_ISO15118_CERTIFICATE_INSTALLATION_ENABLED:false}
    identity-secret: ${OCPP_ISO15118_IDENTITY_SECRET:}
  session-callback:
    max-lifecycle-events-per-connector: ${OCPP_SESSION_CALLBACK_MAX_LIFECYCLE_EVENTS_PER_CONNECTOR:32}
    retry:
      max-attempts: ${OCPP_SESSION_CALLBACK_RETRY_MAX_ATTEMPTS:8}
      initial-backoff-ms: ${OCPP_SESSION_CALLBACK_RETRY_INITIAL_BACKOFF_MS:250}
      max-backoff-ms: ${OCPP_SESSION_CALLBACK_RETRY_MAX_BACKOFF_MS:5000}
      scheduler-threads: ${OCPP_SESSION_CALLBACK_RETRY_SCHEDULER_THREADS:2}

integration:
  http:
    connect-timeout-ms: ${INTEGRATION_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${INTEGRATION_HTTP_READ_TIMEOUT_MS:5000}
  station-service:
    base-url: ${STATION_SERVICE_URL:http://localhost:8081}
  session-service:
    base-url: ${SESSION_SERVICE_URL:http://localhost:8083}
  pnc-service:
    base-url: ${PNC_SERVICE_URL:http://plug-and-charge-platform:8098}

app:
  security:
    id-tag-fingerprint-key: ${APP_SECURITY_ID_TAG_FINGERPRINT_KEY:}
  ocpp:
    redis:
      connection-marker-ttl-seconds: ${OCPP_CONNECTION_MARKER_TTL_SECONDS:120}
    cluster-routing:
      enabled: ${OCPP_CLUSTER_ROUTING_ENABLED:false}
  ocpp-events:
    kafka-enabled: ${OCPP_EVENT_KAFKA_ENABLED:false}
    legacy-session-callbacks-enabled: ${OCPP_LEGACY_SESSION_CALLBACKS_ENABLED:true}
    topic: ${OCPP_DEVICE_EVENT_TOPIC:ocpp.device-events.v2}
    tenant-id: ${OCPP_EVENT_TENANT_ID:electrahub}
    publish-timeout: ${OCPP_EVENT_PUBLISH_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${OCPP_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
