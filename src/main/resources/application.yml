server:
  port: 8082

spring:
  application:
    name: ocpp-service
  mvc:
    async:
      # Remote OCPP commands time out at 30s; keep the servlet async timeout above it.
      request-timeout: ${SERVER_MVC_ASYNC_REQUEST_TIMEOUT:35s}
  datasource:
    url: jdbc:postgresql://localhost:5432/ocpp_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

ocpp:
  heartbeat:
    interval-seconds: ${OCPP_HEARTBEAT_INTERVAL_SECONDS:60}
    timeout-seconds: ${OCPP_HEARTBEAT_TIMEOUT_SECONDS:180}
    check-interval-seconds: ${OCPP_HEARTBEAT_CHECK_INTERVAL_SECONDS:30}
  message:
    response-timeout-seconds: 30
  websocket:
    max-text-message-size: 65536
    max-binary-message-size: 65536

integration:
  http:
    connect-timeout-ms: ${INTEGRATION_HTTP_CONNECT_TIMEOUT_MS:1000}
    read-timeout-ms: ${INTEGRATION_HTTP_READ_TIMEOUT_MS:5000}
  station-service:
    base-url: ${STATION_SERVICE_URL:http://localhost:8081}
  session-service:
    base-url: ${SESSION_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${OCPP_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
