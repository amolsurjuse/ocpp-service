databaseChangeLog:
  - changeSet:
      id: 006-create-ocpp-charger-credentials
      author: codex
      changes:
        - createTable:
            tableName: ocpp_charger_credentials
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: charge_point_id
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: password_hash
                  type: VARCHAR(100)
                  constraints: { nullable: false }
              - column: { name: previous_password_hash, type: VARCHAR(100) }
              - column: { name: previous_valid_until, type: TIMESTAMP WITH TIME ZONE }
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints: { nullable: false }
              - column:
                  name: valid_from
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
              - column: { name: valid_until, type: TIMESTAMP WITH TIME ZONE }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
              - column:
                  name: credential_version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints: { nullable: false }
        - addUniqueConstraint:
            tableName: ocpp_charger_credentials
            columnNames: charge_point_id
            constraintName: uk_ocpp_charger_credentials_charge_point
        - sql:
            sql: >-
              ALTER TABLE ocpp_charger_credentials
              ADD CONSTRAINT ck_ocpp_charger_credentials_status
              CHECK (status IN ('ACTIVE', 'DISABLED'))
        - createTable:
            tableName: ocpp_charger_credential_audit
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints: { primaryKey: true, nullable: false }
              - column:
                  name: charge_point_id
                  type: VARCHAR(255)
                  constraints: { nullable: false }
              - column:
                  name: action
                  type: VARCHAR(24)
                  constraints: { nullable: false }
              - column:
                  name: actor
                  type: VARCHAR(120)
                  constraints: { nullable: false }
              - column:
                  name: credential_version
                  type: BIGINT
                  constraints: { nullable: false }
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints: { nullable: false }
        - createIndex:
            tableName: ocpp_charger_credential_audit
            indexName: idx_ocpp_credential_audit_charge_point_created
            columns:
              - column: { name: charge_point_id }
              - column: { name: created_at }
