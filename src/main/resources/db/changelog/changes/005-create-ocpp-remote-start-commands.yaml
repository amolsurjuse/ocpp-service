databaseChangeLog:
  - changeSet:
      id: create-ocpp-remote-start-commands-table
      author: electrahub
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: ocpp_remote_start_commands
      changes:
        - createTable:
            tableName: ocpp_remote_start_commands
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: command_key
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: correlation_id
                  type: VARCHAR(200)
              - column:
                  name: charge_point_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: id_tag_fingerprint
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: connector_id
                  type: INTEGER
              - column:
                  name: protocol
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: remote_start_id
                  type: INTEGER
              - column:
                  name: state
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: outcome
                  type: VARCHAR(32)
              - column:
                  name: response_payload
                  type: TEXT
              - column:
                  name: failure_reason
                  type: VARCHAR(1000)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: deadline_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
        - addUniqueConstraint:
            tableName: ocpp_remote_start_commands
            columnNames: command_key
            constraintName: uk_ocpp_remote_start_command_key
        - addUniqueConstraint:
            tableName: ocpp_remote_start_commands
            columnNames: message_id
            constraintName: uk_ocpp_remote_start_message_id
        - addUniqueConstraint:
            tableName: ocpp_remote_start_commands
            columnNames: charge_point_id, remote_start_id
            constraintName: uk_ocpp_remote_start_charge_point_id
        - createIndex:
            tableName: ocpp_remote_start_commands
            indexName: idx_remote_start_state_deadline
            columns:
              - column:
                  name: state
              - column:
                  name: deadline_at
        - createIndex:
            tableName: ocpp_remote_start_commands
            indexName: idx_remote_start_charge_point_created
            columns:
              - column:
                  name: charge_point_id
              - column:
                  name: created_at
