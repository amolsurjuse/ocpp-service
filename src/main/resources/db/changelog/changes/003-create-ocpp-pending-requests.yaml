databaseChangeLog:
  - changeSet:
      id: create-ocpp-pending-requests-table
      author: electrahub
      changes:
        - createTable:
            tableName: ocpp_pending_requests
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: charge_point_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: action
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: sent_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: timeout_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: responded
                  type: BOOLEAN
                  defaultValue: false
                  constraints:
                    nullable: false
              - column:
                  name: response_payload
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: responded_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true

        - createIndex:
            tableName: ocpp_pending_requests
            indexName: idx_message_id_pending
            columns:
              - column:
                  name: message_id

        - createIndex:
            tableName: ocpp_pending_requests
            indexName: idx_charge_point_responded
            columns:
              - column:
                  name: charge_point_id
              - column:
                  name: responded
