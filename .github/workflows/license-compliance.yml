name: license-compliance

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  license-compliance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure repository license file exists
        run: |
          if [ ! -f LICENSE ] && [ ! -f LICENSE.md ]; then
            echo "LICENSE or LICENSE.md is required."
            exit 1
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Generate third-party license report
        run: |
          mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.4.0:aggregate-add-third-party \
            -Dlicense.outputDirectory=target/license \
            -Dlicense.thirdPartyFilename=THIRD-PARTY.txt \
            -Dlicense.failOnMissing=false

      - name: Detect disallowed licenses (warn-only)
        run: |
          FILE="target/license/THIRD-PARTY.txt"
          if [ ! -f "$FILE" ]; then
            echo "::warning::THIRD-PARTY license report was not generated; skipping license-pattern scan."
            exit 0
          fi
          grep -Eiq "(AGPL|GPL-3\\.0|SSPL|BUSL|Commons Clause)" "$FILE" \
            && echo "::warning::Potentially disallowed license string detected in THIRD-PARTY report. Manual legal review required." \
            || true

      - name: Upload third-party license report
        if: ${{ hashFiles('target/license/THIRD-PARTY.txt') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: third-party-license-report
          path: target/license/THIRD-PARTY.txt
