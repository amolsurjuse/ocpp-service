name: Engineering task
description: Internal task for refactor, maintenance, or debt reduction
title: "[Task] "
labels: ["type:task", "status:triage"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should this task achieve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In-scope and out-of-scope details
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of done conditions
    validations:
      required: true

